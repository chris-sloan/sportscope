<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPORTSCOPE — Live Rankings</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060810;
    --surface: #0d1117;
    --card: #111827;
    --border: #1f2937;
    --accent1: #f59e0b;
    --accent2: #10b981;
    --accent3: #ef4444;
    --accent4: #8b5cf6;
    --accent5: #06b6d4;
    --text: #f9fafb;
    --muted: #6b7280;
    --hot: #f59e0b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
    z-index: 1000;
  }

  /* Header */
  header {
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: rgba(6,8,16,0.95);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    letter-spacing: 4px;
    background: linear-gradient(90deg, var(--accent1), var(--accent5));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Roboto Mono', monospace;
    font-size: 0.75rem;
    color: var(--accent2);
    letter-spacing: 2px;
  }

  .live-dot {
    width: 8px; height: 8px;
    background: var(--accent2);
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  /* Breadcrumb */
  .breadcrumb {
    padding: 16px 32px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Roboto Mono', monospace;
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .breadcrumb span { cursor: pointer; transition: color 0.2s; }
  .breadcrumb span:hover { color: var(--accent1); }
  .breadcrumb span.active { color: var(--text); }
  .breadcrumb .sep { color: var(--border); }

  /* Page title */
  .page-header {
    padding: 12px 32px 8px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .page-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.5rem, 6vw, 5rem);
    letter-spacing: 3px;
    line-height: 1;
  }

  .ranking-label {
    font-family: 'Roboto Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 2px;
    padding-bottom: 8px;
  }

  .personalised-banner {
    margin: 0 32px 8px;
    padding: 10px 16px;
    background: linear-gradient(135deg, rgba(245,158,11,0.15), rgba(16,185,129,0.1));
    border: 1px solid rgba(245,158,11,0.3);
    border-radius: 8px;
    font-family: 'Roboto Mono', monospace;
    font-size: 0.75rem;
    color: var(--accent1);
    letter-spacing: 1.5px;
    display: none;
    align-items: center;
    gap: 10px;
  }

  .personalised-banner.show { display: flex; animation: slideIn 0.4s ease; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Grid */
  .grid {
    padding: 16px 32px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  /* Card */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), border-color 0.25s, box-shadow 0.25s;
    will-change: transform;
  }

  .card:hover {
    transform: translateY(-4px) scale(1.01);
    border-color: var(--card-accent, var(--accent1));
    box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px var(--card-accent, var(--accent1));
  }

  .card:active { transform: scale(0.98); }

  /* Card image strip */
  .card-image {
    height: 140px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 5rem;
    background: var(--card-bg, linear-gradient(135deg, #1f2937, #111827));
  }

  .card-image::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 40%, var(--card) 100%);
  }

  /* Rank badge */
  .rank-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.8rem;
    line-height: 1;
    color: rgba(255,255,255,0.12);
    z-index: 2;
    transition: color 0.3s;
    user-select: none;
  }

  .card:hover .rank-badge { color: rgba(255,255,255,0.3); }

  /* Hot badge for top-ranked after reorder */
  .rank-1-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: var(--accent1);
    color: #000;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 1px;
    padding: 2px 8px;
    border-radius: 4px;
    z-index: 2;
    display: none;
  }

  /* Card body */
  .card-body {
    padding: 14px 16px 16px;
  }

  .card-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 2px;
    line-height: 1;
    margin-bottom: 6px;
  }

  .card-meta {
    font-size: 0.78rem;
    color: var(--muted);
    font-family: 'Roboto Mono', monospace;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-score {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .score-bar {
    width: 60px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .score-fill {
    height: 100%;
    background: var(--card-accent, var(--accent1));
    border-radius: 2px;
    transition: width 0.6s ease;
  }

  /* Arrows for moved cards */
  .move-indicator {
    position: absolute;
    top: 50%;
    right: 14px;
    transform: translateY(-50%);
    font-size: 1.3rem;
    font-weight: 900;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 5;
  }

  .card.moved-up .move-indicator { opacity: 1; color: var(--accent2); content: '▲'; }
  .card.moved-down .move-indicator { opacity: 1; color: var(--accent3); }

  /* REORDER ANIMATION */
  @keyframes reorderFlash {
    0% { background: var(--card); }
    20% { background: rgba(245,158,11,0.25); box-shadow: 0 0 30px rgba(245,158,11,0.4); }
    100% { background: var(--card); }
  }

  .card.reordering { animation: reorderFlash 1s ease forwards; }

  /* moved up — bright green flash */
  @keyframes movedUp {
    0% { background: var(--card); }
    15% { background: rgba(16,185,129,0.3); box-shadow: 0 0 40px rgba(16,185,129,0.5); border-color: var(--accent2); }
    100% { background: var(--card); }
  }

  @keyframes movedDown {
    0% { background: var(--card); }
    15% { background: rgba(239,68,68,0.2); box-shadow: 0 0 30px rgba(239,68,68,0.3); border-color: var(--accent3); }
    100% { background: var(--card); }
  }

  .card.flash-up { animation: movedUp 1.2s ease forwards; }
  .card.flash-down { animation: movedDown 1.2s ease forwards; }

  /* Detail view */
  .detail-view {
    padding: 32px;
    max-width: 800px;
    margin: 0 auto;
    animation: fadeSlideIn 0.4s ease;
  }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .detail-hero {
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 32px;
    font-size: 8rem;
  }

  .detail-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--detail-bg);
    opacity: 0.3;
  }

  .detail-hero-emoji { position: relative; z-index: 1; filter: drop-shadow(0 0 40px currentColor); }

  .detail-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 8vw, 6rem);
    letter-spacing: 4px;
    line-height: 1;
    margin-bottom: 8px;
  }

  .detail-tag {
    font-family: 'Roboto Mono', monospace;
    font-size: 0.8rem;
    color: var(--accent1);
    letter-spacing: 3px;
    margin-bottom: 32px;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }

  .stat-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
  }

  .stat-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.5rem;
    letter-spacing: 2px;
    color: var(--accent1);
    line-height: 1;
  }

  .stat-label {
    font-family: 'Roboto Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 2px;
    margin-top: 4px;
  }

  .bio-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent1);
    border-radius: 10px;
    padding: 20px 24px;
    font-size: 0.95rem;
    line-height: 1.7;
    color: #d1d5db;
    margin-bottom: 24px;
  }

  .fun-fact {
    background: linear-gradient(135deg, rgba(245,158,11,0.12), rgba(139,92,246,0.08));
    border: 1px solid rgba(245,158,11,0.25);
    border-radius: 10px;
    padding: 20px 24px;
  }

  .fun-fact-label {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 3px;
    font-size: 0.9rem;
    color: var(--accent1);
    margin-bottom: 8px;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 24px 32px 0;
    padding: 10px 20px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-family: 'Roboto Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .back-btn:hover { border-color: var(--accent1); color: var(--accent1); }

  /* Ticker at bottom */
  .ticker {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--accent1);
    color: #000;
    font-family: 'Roboto Mono', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 6px 0;
    overflow: hidden;
    z-index: 50;
  }

  .ticker-inner {
    display: flex;
    white-space: nowrap;
    animation: ticker 30s linear infinite;
  }

  .ticker-item { padding: 0 48px; }

  @keyframes ticker {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  /* Grid animation for reorder */
  .grid-reordering .card {
    transition: transform 0.5s cubic-bezier(0.34,1.2,0.64,1);
  }

  /* Responsive */
  @media (max-width: 600px) {
    .grid { padding: 12px 16px 60px; }
    header { padding: 14px 16px; }
    .breadcrumb { padding: 12px 16px; }
    .page-header { padding: 8px 16px; }
    .personalised-banner { margin: 0 16px 8px; }
    .detail-view { padding: 16px; }
    .back-btn { margin: 16px 16px 0; }
  }
</style>
</head>

// ============================================================
// WEIGHTING ENGINE
// ============================================================
// Structure: { pageKey: { itemId: clickCount } }
// pageKey = 'sports' | 'teams_football' | 'players_mancity' etc.

const STORAGE_KEY = 'sportscope_weights';

function loadWeights() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}

function saveWeights(w) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(w));
}

function recordClick(pageKey, itemId) {
  const w = loadWeights();
  if (!w[pageKey]) w[pageKey] = {};
  w[pageKey][itemId] = (w[pageKey][itemId] || 0) + 1;
  saveWeights(w);
}

function getWeightedOrder(pageKey, items) {
  const w = loadWeights();
  const pageWeights = w[pageKey] || {};
  // Score = clicks * 10 + small random noise for ties
  return [...items].sort((a, b) => {
    const scoreA = (pageWeights[a.id] || 0) * 10 + Math.random() * 0.1;
    const scoreB = (pageWeights[b.id] || 0) * 10 + Math.random() * 0.1;
    return scoreB - scoreA;
  });
}

function hasPersonalisation(pageKey) {
  const w = loadWeights();
  return Object.keys(w[pageKey] || {}).length > 0;
}

function getMaxScore(pageKey) {
  const w = loadWeights();
  const pageWeights = w[pageKey] || {};
  return Math.max(0, ...Object.values(pageWeights));
}

// ============================================================
// STATE
// ============================================================
let currentState = { level: 'sports', sport: null, team: null };

// ============================================================
// RENDER ENGINE
// ============================================================

function getPageKey() {
  if (currentState.level === 'sports') return 'sports';
  if (currentState.level === 'teams') return `teams_${currentState.sport}`;
  if (currentState.level === 'players') return `players_${currentState.team}`;
  return 'sports';
}

function getCurrentItems() {
  if (currentState.level === 'sports') return DATA.sports;
  if (currentState.level === 'teams') return DATA.teams[currentState.sport] || [];
  if (currentState.level === 'players') return DATA.players[currentState.team] || [];
  return [];
}

function render() {
  const level = currentState.level;

  if (level === 'detail') {
    renderDetail();
    return;
  }

  const pageKey = getPageKey();
  const items = getCurrentItems();
  const orderedItems = getWeightedOrder(pageKey, items);
  const personalised = hasPersonalisation(pageKey);
  const maxScore = getMaxScore(pageKey);
  const weights = loadWeights()[pageKey] || {};

  // Page title
  const titles = { sports: 'SPORTS', teams: currentState.sport?.toUpperCase(), players: currentState.team?.toUpperCase() };
  document.getElementById('pageTitle').textContent = titles[level] || 'SPORTS';

  // Banner
  const banner = document.getElementById('personalisedBanner');
  if (personalised) banner.classList.add('show');
  else banner.classList.remove('show');

  // Breadcrumb
  updateBreadcrumb();

  // Grid
  const grid = document.createElement('div');
  grid.className = 'grid';

  orderedItems.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--card-accent', item.color);
    card.style.setProperty('--card-bg', item.bg);
    card.dataset.id = item.id;
    card.dataset.rank = idx + 1;

    const clickCount = weights[item.id] || 0;
    const scorePercent = maxScore > 0 ? Math.round((clickCount / maxScore) * 100) : 0;

    card.innerHTML = `
      <div class="card-image" style="background: ${item.bg}">
        <span style="font-size:4.5rem;position:relative;z-index:1;">${item.emoji}</span>
        <div class="rank-badge">${idx + 1}</div>
        ${idx === 0 && personalised ? '<div class="rank-1-badge" style="display:block">TOP PICK</div>' : ''}
      </div>
      <div class="card-body">
        <div class="card-name" style="color:${item.color}">${item.name}</div>
        <div class="card-meta">
          <span>${item.tag}</span>
          <div class="card-score">
            <div class="score-bar"><div class="score-fill" style="width:${scorePercent}%;background:${item.color}"></div></div>
            <span style="font-size:0.65rem;color:${item.color}">${clickCount > 0 ? clickCount+'x' : ''}</span>
          </div>
        </div>
      </div>
      <span class="move-indicator"></span>
    `;

    card.addEventListener('click', () => handleCardClick(item, card, pageKey));
    grid.appendChild(card);
  });

  // Replace content
  const content = document.getElementById('mainContent');
  const existing = content.querySelector('.grid');
  if (existing) {
    // Animate out old, in new
    existing.style.opacity = '0';
    existing.style.transform = 'translateY(8px)';
    existing.style.transition = 'all 0.2s ease';
    setTimeout(() => {
      content.innerHTML = '';
      grid.style.opacity = '0';
      content.appendChild(grid);
      requestAnimationFrame(() => {
        grid.style.transition = 'opacity 0.3s ease';
        grid.style.opacity = '1';
      });
    }, 200);
  } else {
    content.innerHTML = '';
    content.appendChild(grid);
  }

  updateTicker(orderedItems);
}

function handleCardClick(item, cardEl, pageKey) {
  // Record the click
  recordClick(pageKey, item.id);

  // Flash the card
  cardEl.classList.add('reordering');
  setTimeout(() => cardEl.classList.remove('reordering'), 1000);

  // Navigate
  setTimeout(() => navigate(item), 150);
}

function navigate(item) {
  if (currentState.level === 'sports') {
    currentState = { level: 'teams', sport: item.id, team: null };
    render();
  } else if (currentState.level === 'teams') {
    currentState = { ...currentState, level: 'players', team: item.id };
    render();
  } else if (currentState.level === 'players') {
    currentState = { ...currentState, level: 'detail', player: item };
    renderDetail();
  }
}

function goBack() {
  if (currentState.level === 'detail') {
    currentState = { ...currentState, level: 'players', player: null };
  } else if (currentState.level === 'players') {
    currentState = { level: 'teams', sport: currentState.sport, team: null };
  } else if (currentState.level === 'teams') {
    currentState = { level: 'sports', sport: null, team: null };
  }
  render();

  // After going back, animate cards that moved
  setTimeout(animateReorder, 300);
}

function animateReorder() {
  const cards = document.querySelectorAll('.card');
  cards.forEach((card, idx) => {
    const rank = parseInt(card.dataset.rank);
    if (rank !== idx + 1) {
      // Rank changed — already reordered by JS, just flash
      const moved = rank > idx + 1 ? 'flash-up' : 'flash-down';
      card.classList.add(moved);
      setTimeout(() => card.classList.remove(moved), 1200);
      card.dataset.rank = idx + 1;
    }
  });
}

function renderDetail() {
  const player = currentState.player;
  if (!player) { goBack(); return; }

  document.getElementById('pageTitle').textContent = 'PROFILE';
  updateBreadcrumb();
  document.getElementById('personalisedBanner').classList.remove('show');

  const detail = DATA.playerDetails[player.id] || DATA.playerDetails._default;

  const view = document.createElement('div');
  view.className = 'detail-view';
  view.innerHTML = `
    <div class="detail-hero" style="background:${player.bg};--detail-bg:${player.color}">
      <span class="detail-hero-emoji">${player.emoji}</span>
    </div>
    <div class="detail-name" style="color:${player.color}">${player.name}</div>
    <div class="detail-tag">${player.tag}</div>
    <div class="stat-grid">
      ${detail.stats.map(s => `
        <div class="stat-box">
          <div class="stat-value" style="color:${player.color}">${s.v}</div>
          <div class="stat-label">${s.l}</div>
        </div>
      `).join('')}
    </div>
    <div class="bio-block">${detail.bio}</div>
    <div class="fun-fact">
      <div class="fun-fact-label">⚡ UNIQUE FACT</div>
      <div style="font-size:0.95rem;line-height:1.6;color:#e5e7eb">${detail.fact}</div>
    </div>
  `;

  const content = document.getElementById('mainContent');
  content.innerHTML = '';
  content.appendChild(view);

  updateTicker([player]);
}

function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  const parts = [{ label: 'HOME', fn: () => { currentState = {level:'sports',sport:null,team:null}; render(); } }];
  if (currentState.sport) parts.push({ label: currentState.sport.toUpperCase(), fn: () => { currentState = {level:'teams',sport:currentState.sport,team:null}; render(); } });
  if (currentState.team) parts.push({ label: currentState.team.toUpperCase(), fn: () => { currentState = {...currentState,level:'players',player:null}; render(); } });
  if (currentState.level === 'detail' && currentState.player) parts.push({ label: currentState.player.name.toUpperCase(), fn: null });

  bc.innerHTML = parts.map((p, i) => {
    const isLast = i === parts.length - 1;
    return `${i > 0 ? '<span class="sep">›</span>' : ''}<span class="${isLast ? 'active' : ''}" onclick="${p.fn ? `(${p.fn.toString().replace(/\n/g,'')})()` : ''}">${p.label}</span>`;
  }).join('');

  // Re-attach click handlers properly
  bc.querySelectorAll('span:not(.sep):not(.active)').forEach((el, i) => {
    if (parts[i] && parts[i].fn) el.onclick = parts[i].fn;
  });
  bc.querySelectorAll('span').forEach((el, i) => {
    const part = parts.filter(p => !p.sep)[0]; // rebuild properly
  });
  // Simpler approach: rebuild
  bc.innerHTML = '';
  parts.forEach((p, i) => {
    if (i > 0) { const sep = document.createElement('span'); sep.className = 'sep'; sep.textContent = '›'; bc.appendChild(sep); }
    const el = document.createElement('span');
    el.textContent = p.label;
    if (i === parts.length - 1) el.className = 'active';
    if (p.fn) el.onclick = p.fn;
    bc.appendChild(el);
  });

  // Back button
  let backBtn = document.querySelector('.back-btn');
  if (backBtn) backBtn.remove();

  if (currentState.level !== 'sports') {
    const btn = document.createElement('button');
    btn.className = 'back-btn';
    btn.innerHTML = '← BACK';
    btn.onclick = goBack;
    document.getElementById('mainContent').before(btn);
  }
}

function updateTicker(items) {
  const ticker = document.getElementById('tickerInner');
  const texts = items.flatMap(i => [`${i.emoji} ${i.name.toUpperCase()}`, `◆`]);
  const doubled = [...texts, ...texts]; // seamless loop
  ticker.innerHTML = doubled.map(t => `<span class="ticker-item">${t}</span>`).join('');
}

// ============================================================
// INIT
// ============================================================
render();
</script>
