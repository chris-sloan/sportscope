<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAULT — Live Event Tickets</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0a0a0a;
  --paper: #f5f0e8;
  --cream: #ede8db;
  --accent: #e63329;
  --gold: #c9a84c;
  --teal: #1a7a6e;
  --surface: #fff;
  --muted: #888;
  --border: #ddd8cc;
  --ticket-perf: #f5f0e8;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Noise texture overlay */
body::after {
  content:'';
  position:fixed;
  inset:0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;
  z-index:999;
  opacity:0.6;
}

/* ─── HEADER ─── */
header {
  background: var(--ink);
  color: var(--paper);
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 3px solid var(--accent);
}

.logo {
  font-family: 'Anton', sans-serif;
  font-size: 2rem;
  letter-spacing: 6px;
  color: var(--paper);
}
.logo span { color: var(--accent); }

.header-right {
  display: flex;
  align-items: center;
  gap: 20px;
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem;
  color: #888;
  letter-spacing: 1px;
}

.cart-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 8px 16px;
  font-family: 'Anton', sans-serif;
  font-size: 0.9rem;
  letter-spacing: 2px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: background 0.2s;
}
.cart-btn:hover { background: #c42820; }
.cart-count {
  background: var(--gold);
  color: var(--ink);
  border-radius: 50%;
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.75rem;
  font-family: 'Space Mono', monospace;
}

/* ─── NAV BAR ─── */
.nav-bar {
  background: var(--cream);
  border-bottom: 2px solid var(--border);
  padding: 0 32px;
  display: flex;
  align-items: center;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.nav-bar::-webkit-scrollbar { display:none; }

.nav-item {
  font-family: 'Space Mono', monospace;
  font-size: 0.72rem;
  letter-spacing: 2px;
  padding: 14px 20px;
  cursor: pointer;
  color: var(--muted);
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  transition: all 0.2s;
  text-transform: uppercase;
}
.nav-item:hover { color: var(--ink); }
.nav-item.active { color: var(--accent); border-bottom-color: var(--accent); }
.nav-item.venue-boost {
  color: var(--teal);
  position: relative;
}
.nav-item.venue-boost::after {
  content: '★';
  font-size: 0.5rem;
  position: absolute;
  top: 8px;
  right: 8px;
  color: var(--gold);
}

/* ─── PERSONALISATION BANNER ─── */
.promo-banner {
  background: var(--ink);
  color: var(--paper);
  padding: 10px 32px;
  font-family: 'Space Mono', monospace;
  font-size: 0.72rem;
  letter-spacing: 1.5px;
  display: none;
  align-items: center;
  gap: 12px;
  border-bottom: 2px solid var(--gold);
}
.promo-banner.show { display: flex; }
.promo-dot { width:8px;height:8px;background:var(--gold);border-radius:50%;animation:blink 1.5s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ─── HERO ─── */
.hero {
  background: var(--ink);
  color: var(--paper);
  padding: 48px 32px 40px;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content:'';
  position:absolute;
  inset:0;
  background: repeating-linear-gradient(
    45deg,
    transparent,
    transparent 40px,
    rgba(255,255,255,0.015) 40px,
    rgba(255,255,255,0.015) 80px
  );
}
.hero-eyebrow {
  font-family: 'Space Mono', monospace;
  font-size: 0.72rem;
  letter-spacing: 4px;
  color: var(--accent);
  margin-bottom: 12px;
}
.hero-title {
  font-family: 'Anton', sans-serif;
  font-size: clamp(3rem, 8vw, 7rem);
  letter-spacing: 2px;
  line-height: 0.9;
  margin-bottom: 16px;
  position: relative;
  z-index: 1;
}
.hero-title em { color: var(--gold); font-style: normal; }
.hero-sub {
  font-size: 1rem;
  color: #aaa;
  max-width: 400px;
  line-height: 1.6;
  position: relative;
  z-index: 1;
}

/* ─── PAGE LAYOUT ─── */
.page-wrap {
  padding: 32px;
  max-width: 1400px;
  margin: 0 auto;
}

.section-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.68rem;
  letter-spacing: 4px;
  color: var(--muted);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.section-label::after { content:''; flex:1; height:1px; background:var(--border); }

.section-title {
  font-family: 'Anton', sans-serif;
  font-size: clamp(1.8rem, 4vw, 3rem);
  letter-spacing: 2px;
  margin-bottom: 24px;
  line-height: 1;
}

/* ─── SPORT CARDS ─── */
.sports-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 2px;
  background: var(--border);
  border: 2px solid var(--border);
  margin-bottom: 48px;
}

.sport-card {
  background: var(--surface);
  padding: 28px 24px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: background 0.2s;
  border-left: 4px solid transparent;
}
.sport-card::before {
  content:'';
  position:absolute;
  top:0; right:0;
  width:0; height:100%;
  background: var(--sport-color, var(--accent));
  opacity:0.06;
  transition: width 0.3s ease;
}
.sport-card:hover::before { width:100%; }
.sport-card:hover { border-left-color: var(--sport-color, var(--accent)); }

.sport-emoji { font-size: 2.5rem; margin-bottom: 12px; display:block; }
.sport-name {
  font-family: 'Anton', sans-serif;
  font-size: 1.6rem;
  letter-spacing: 2px;
  margin-bottom: 4px;
  color: var(--sport-color, var(--ink));
}
.sport-meta {
  font-family: 'Space Mono', monospace;
  font-size: 0.68rem;
  color: var(--muted);
  letter-spacing: 1px;
}
.sport-count {
  position:absolute;
  top:16px; right:16px;
  font-family: 'Anton', sans-serif;
  font-size: 2.5rem;
  color: var(--border);
  line-height:1;
}
.sport-rank {
  position:absolute;
  bottom:12px; right:12px;
  font-family:'Space Mono',monospace;
  font-size:0.6rem;
  color: var(--muted);
  letter-spacing:1px;
}
.boost-tag {
  display:inline-block;
  background: var(--teal);
  color:#fff;
  font-family:'Space Mono',monospace;
  font-size:0.58rem;
  letter-spacing:1.5px;
  padding: 2px 6px;
  margin-top:6px;
}

/* ─── EVENT CARDS ─── */
.events-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
  margin-bottom: 48px;
}

.event-card {
  background: var(--surface);
  border: 2px solid var(--border);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 0.25s cubic-bezier(0.34,1.4,0.64,1), box-shadow 0.25s, border-color 0.25s;
}
.event-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.12);
  border-color: var(--event-color, var(--accent));
}

.event-header {
  background: var(--ink);
  padding: 20px;
  position: relative;
  overflow: hidden;
}
.event-header::after {
  content:'';
  position:absolute;
  inset:0;
  background: var(--event-color, var(--accent));
  opacity:0.15;
}
.event-sport-tag {
  font-family:'Space Mono',monospace;
  font-size:0.62rem;
  letter-spacing:3px;
  color: var(--event-color, var(--accent));
  position:relative;z-index:1;
  margin-bottom:8px;
}
.event-name {
  font-family:'Anton',sans-serif;
  font-size:1.5rem;
  letter-spacing:2px;
  color: var(--paper);
  line-height:1.1;
  position:relative;z-index:1;
  margin-bottom:8px;
}
.event-date-badge {
  display:inline-block;
  background: var(--event-color, var(--accent));
  color:#fff;
  font-family:'Space Mono',monospace;
  font-size:0.65rem;
  letter-spacing:1px;
  padding:3px 10px;
  position:relative;z-index:1;
}

.event-body { padding:16px 20px; }
.event-venue {
  font-family:'Space Mono',monospace;
  font-size:0.68rem;
  letter-spacing:1.5px;
  color: var(--muted);
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:6px;
}
.event-venue-dot {
  width:6px;height:6px;
  background: var(--teal);
  border-radius:50%;
}
.event-price-range {
  font-family:'Anton',sans-serif;
  font-size:1.3rem;
  letter-spacing:1px;
  color: var(--ink);
}
.event-price-range span { font-family:'DM Sans',sans-serif; font-size:0.75rem; color:var(--muted); font-weight:400; }
.event-avail {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:10px;
}
.avail-bar-wrap { flex:1; margin-right:12px; }
.avail-label { font-family:'Space Mono',monospace; font-size:0.6rem; color:var(--muted); letter-spacing:1px; margin-bottom:4px; }
.avail-bar { height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
.avail-fill { height:100%; border-radius:2px; background:var(--teal); transition:width 0.6s ease; }
.avail-fill.low { background:var(--accent); }
.cta-arrow {
  font-family:'Anton',sans-serif;
  font-size:1.4rem;
  color:var(--event-color,var(--accent));
  transition: transform 0.2s;
}
.event-card:hover .cta-arrow { transform:translateX(4px); }

.rank-indicator {
  position:absolute;
  top:12px;right:12px;
  font-family:'Anton',sans-serif;
  font-size:3rem;
  color:rgba(255,255,255,0.08);
  line-height:1;
  z-index:0;
}

/* Flash animations */
@keyframes flashUp {
  0%{background:var(--surface)}
  20%{background:rgba(26,122,110,0.15);box-shadow:0 0 30px rgba(26,122,110,0.3)}
  100%{background:var(--surface)}
}
@keyframes flashDown {
  0%{background:var(--surface)}
  20%{background:rgba(230,51,41,0.1);box-shadow:0 0 20px rgba(230,51,41,0.2)}
  100%{background:var(--surface)}
}
.flash-up { animation: flashUp 1.2s ease forwards; }
.flash-down { animation: flashDown 1.2s ease forwards; }

/* ─── TICKET DETAIL ─── */
.detail-wrap {
  max-width:900px;
  margin:0 auto;
  animation: fadeUp 0.4s ease;
}
@keyframes fadeUp {
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}

.event-hero {
  background: var(--ink);
  padding: 48px 40px;
  position: relative;
  overflow: hidden;
  margin-bottom:0;
}
.event-hero::before {
  content:'';
  position:absolute;
  inset:0;
  background: var(--hero-color,var(--accent));
  opacity:0.12;
}
.event-hero-sport {
  font-family:'Space Mono',monospace;
  font-size:0.72rem;
  letter-spacing:4px;
  color:var(--hero-color,var(--accent));
  margin-bottom:12px;
  position:relative;z-index:1;
}
.event-hero-name {
  font-family:'Anton',sans-serif;
  font-size:clamp(2.5rem,6vw,5.5rem);
  letter-spacing:2px;
  color:var(--paper);
  line-height:0.95;
  margin-bottom:16px;
  position:relative;z-index:1;
}
.event-hero-meta {
  display:flex;
  flex-wrap:wrap;
  gap:16px;
  position:relative;z-index:1;
}
.meta-pill {
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.15);
  color:var(--paper);
  font-family:'Space Mono',monospace;
  font-size:0.7rem;
  letter-spacing:1.5px;
  padding:6px 14px;
}
.meta-pill strong { color:var(--hero-color,var(--accent)); }

/* ─── TICKETS ─── */
.tickets-section {
  background:var(--cream);
  border:2px solid var(--border);
  border-top:none;
}
.tickets-header {
  padding:24px 32px 16px;
  border-bottom:2px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
}
.tickets-title {
  font-family:'Anton',sans-serif;
  font-size:1.6rem;
  letter-spacing:2px;
}

.ticket-stub {
  margin:16px 24px;
  background:var(--surface);
  border:2px solid var(--border);
  display:flex;
  overflow:hidden;
  position:relative;
  transition: box-shadow 0.2s, border-color 0.2s, transform 0.2s;
}

/* Perforated edge */
.ticket-stub::before {
  content:'';
  position:absolute;
  left:160px;
  top:0; bottom:0;
  width:0;
  border-left: 2px dashed var(--border);
  z-index:2;
}

.ticket-left {
  width:160px;
  min-width:160px;
  background: var(--tier-color, var(--ink));
  color:#fff;
  padding:20px 16px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
}
.tier-name {
  font-family:'Anton',sans-serif;
  font-size:1.2rem;
  letter-spacing:2px;
  margin-bottom:4px;
}
.tier-price {
  font-family:'Anton',sans-serif;
  font-size:2rem;
  line-height:1;
}
.tier-price-sub {
  font-family:'Space Mono',monospace;
  font-size:0.6rem;
  opacity:0.7;
  letter-spacing:1px;
}

.ticket-right {
  flex:1;
  padding:20px 20px 20px 32px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.ticket-perks {
  list-style:none;
  margin-bottom:12px;
}
.ticket-perks li {
  font-size:0.85rem;
  color:#555;
  padding:3px 0;
  display:flex;
  align-items:center;
  gap:8px;
}
.ticket-perks li::before { content:'✓'; color:var(--tier-color,var(--teal)); font-weight:700; }
.ticket-bottom {
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:8px;
}
.avail-text {
  font-family:'Space Mono',monospace;
  font-size:0.65rem;
  letter-spacing:1px;
}
.avail-text.scarce { color:var(--accent); }
.avail-text.ok { color:var(--teal); }

.buy-btn {
  background: var(--tier-color, var(--ink));
  color:#fff;
  border:none;
  padding:10px 24px;
  font-family:'Anton',sans-serif;
  font-size:1rem;
  letter-spacing:2px;
  cursor:pointer;
  transition: opacity 0.2s, transform 0.1s;
}
.buy-btn:hover { opacity:0.85; }
.buy-btn:active { transform:scale(0.97); }

/* Hole punches on ticket */
.hole {
  position:absolute;
  width:20px; height:20px;
  background:var(--cream);
  border-radius:50%;
  border:2px solid var(--border);
  left:150px;
}
.hole.top { top:-10px; }
.hole.bottom { bottom:-10px; }

/* ─── VENUE CROSSELL ─── */
.venue-section {
  margin-top:32px;
  background: var(--ink);
  padding:32px;
  color:var(--paper);
}
.venue-title {
  font-family:'Anton',sans-serif;
  font-size:1.4rem;
  letter-spacing:2px;
  margin-bottom:6px;
  color:var(--gold);
}
.venue-sub {
  font-family:'Space Mono',monospace;
  font-size:0.68rem;
  letter-spacing:1.5px;
  color:#888;
  margin-bottom:20px;
}
.venue-events-row {
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding-bottom:4px;
  scrollbar-width:none;
}
.venue-events-row::-webkit-scrollbar { display:none; }
.venue-mini-card {
  min-width:200px;
  background: rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  padding:14px;
  cursor:pointer;
  transition: background 0.2s, border-color 0.2s;
  flex-shrink:0;
}
.venue-mini-card:hover {
  background:rgba(255,255,255,0.12);
  border-color:var(--gold);
}
.vmc-sport {
  font-family:'Space Mono',monospace;
  font-size:0.6rem;
  letter-spacing:2px;
  color:var(--gold);
  margin-bottom:6px;
}
.vmc-name {
  font-family:'Anton',sans-serif;
  font-size:1rem;
  letter-spacing:1px;
  color:var(--paper);
  margin-bottom:4px;
  line-height:1.1;
}
.vmc-price {
  font-family:'Space Mono',monospace;
  font-size:0.65rem;
  color:#aaa;
}

/* ─── BACK / BREADCRUMB ─── */
.top-controls {
  padding:16px 32px;
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--cream);
  border-bottom:1px solid var(--border);
}
.back-btn {
  background:none;
  border:2px solid var(--border);
  padding:6px 14px;
  font-family:'Space Mono',monospace;
  font-size:0.7rem;
  letter-spacing:1.5px;
  cursor:pointer;
  color:var(--ink);
  transition:all 0.2s;
}
.back-btn:hover { border-color:var(--ink); }

.bc-trail {
  display:flex;
  align-items:center;
  gap:6px;
  font-family:'Space Mono',monospace;
  font-size:0.68rem;
  letter-spacing:1px;
  color:var(--muted);
  flex-wrap:wrap;
}
.bc-trail span { cursor:pointer; transition:color 0.2s; }
.bc-trail span:hover { color:var(--accent); }
.bc-trail .bc-sep { color:var(--border); cursor:default; }
.bc-trail .bc-active { color:var(--ink); cursor:default; }

/* ─── CART TOAST ─── */
.cart-toast {
  position:fixed;
  bottom:24px; right:24px;
  background:var(--teal);
  color:#fff;
  padding:14px 20px;
  font-family:'Anton',sans-serif;
  font-size:1rem;
  letter-spacing:2px;
  z-index:500;
  opacity:0;
  transform:translateY(12px);
  transition:all 0.3s ease;
  pointer-events:none;
  box-shadow:0 8px 32px rgba(0,0,0,0.2);
}
.cart-toast.show { opacity:1; transform:translateY(0); }

/* ─── TICKER ─── */
.ticker-bar {
  background:var(--accent);
  overflow:hidden;
  white-space:nowrap;
  padding:6px 0;
  position:fixed;
  bottom:0;left:0;right:0;
  z-index:90;
}
.ticker-inner {
  display:inline-flex;
  animation: tickerScroll 40s linear infinite;
}
.ticker-item {
  font-family:'Space Mono',monospace;
  font-size:0.7rem;
  letter-spacing:2px;
  color:#fff;
  padding:0 48px;
}
@keyframes tickerScroll {
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}

/* ─── RESPONSIVE ─── */
@media(max-width:600px){
  header { padding:0 16px; }
  .hero,.page-wrap,.top-controls { padding-left:16px; padding-right:16px; }
  .ticket-stub::before { left:120px; }
  .ticket-left { width:120px; min-width:120px; }
  .hole { left:110px; }
  .event-hero { padding:32px 20px; }
  .tickets-header { padding:16px 20px; }
  .ticket-right { padding:16px 16px 16px 24px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">VAULT<span>.</span></div>
  <div class="header-right">
    <span id="sessionLabel">NEW SESSION</span>
    <button class="cart-btn" id="cartBtn">
      🎟 BASKET <div class="cart-count" id="cartCount">0</div>
    </button>
  </div>
</header>

<!-- PERSONALISATION BANNER -->
<div class="promo-banner" id="promoBanner">
  <div class="promo-dot"></div>
  <span>PERSONALISED PICKS — ranked by your browsing history</span>
  <span style="color:var(--gold);margin-left:auto">VENUE BOOST ACTIVE</span>
</div>

<!-- TOP CONTROLS -->

// Venue → which sports events are co-located (for cross-sell)
// Computed automatically from event data

// ═══════════════════════════════════════════════════════
// VENUE CROSS-SELL ENGINE
// When you view events at a venue, other sports at that venue get boosted
// ═══════════════════════════════════════════════════════

function getEventsAtVenue(venueId, excludeSport) {
  const results = [];
  Object.entries(EVENTS).forEach(([sport, evts]) => {
    if (sport === excludeSport) return;
    evts.forEach(e => {
      if (e.venue === venueId) results.push(e);
    });
  });
  return results;
}

function getVenuesForSport(sportId) {
  const venues = new Set();
  (EVENTS[sportId] || []).forEach(e => venues.add(e.venue));
  return [...venues];
}

// ═══════════════════════════════════════════════════════
// WEIGHTING ENGINE
// ═══════════════════════════════════════════════════════

const STORE_KEY = 'vault_weights_v2';
let cart = [];

function loadW() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch { return {}; }
}
function saveW(w) { localStorage.setItem(STORE_KEY, JSON.stringify(w)); }

function recordView(type, id) {
  // type: 'sport' | 'event' | 'venue'
  const w = loadW();
  const key = `${type}:${id}`;
  w[key] = (w[key] || 0) + 1;
  saveW(w);
}

function getSportScore(sportId) {
  const w = loadW();
  let score = (w[`sport:${sportId}`] || 0) * 10;

  // Venue boost: if user viewed events at venues that also host this sport, boost
  const sportVenues = getVenuesForSport(sportId);
  const otherSports = Object.keys(EVENTS).filter(s => s !== sportId);
  otherSports.forEach(otherSport => {
    (EVENTS[otherSport] || []).forEach(e => {
      if (sportVenues.includes(e.venue)) {
        const venueScore = w[`event:${e.id}`] || 0;
        score += venueScore * 3; // venue boost factor
      }
    });
  });

  return score;
}

function getEventScore(event) {
  const w = loadW();
  let score = (w[`event:${event.id}`] || 0) * 10;
  score += (w[`venue:${event.venue}`] || 0) * 4;
  return score;
}

function rankSports() {
  return [...SPORTS].sort((a, b) => {
    const sa = getSportScore(a.id) + Math.random() * 0.1;
    const sb = getSportScore(b.id) + Math.random() * 0.1;
    return sb - sa;
  });
}

function rankEvents(sportId) {
  return [...(EVENTS[sportId] || [])].sort((a, b) => {
    const sa = getEventScore(a) + Math.random() * 0.1;
    const sb = getEventScore(b) + Math.random() * 0.1;
    return sb - sa;
  });
}

function hasHistory() {
  const w = loadW();
  return Object.keys(w).length > 0;
}

function getVenueBoostSports() {
  // Returns sport IDs that have venue-boost (not direct click boost)
  const w = loadW();
  return SPORTS.filter(s => {
    const direct = w[`sport:${s.id}`] || 0;
    const total = getSportScore(s.id);
    return total > 0 && direct === 0;
  }).map(s => s.id);
}

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════

let state = { view: 'home', sport: null, event: null };

// ═══════════════════════════════════════════════════════
// NAV
// ═══════════════════════════════════════════════════════

function buildNav() {
  const nav = document.createElement('div');
  nav.className = 'nav-bar';
  const venueBoostSports = getVenueBoostSports();
  const all = document.createElement('div');
  all.className = `nav-item ${state.view === 'home' ? 'active' : ''}`;
  all.textContent = 'ALL SPORTS';
  all.onclick = () => navigate('home');
  nav.appendChild(all);
  SPORTS.forEach(s => {
    const el = document.createElement('div');
    const isVenueBoost = venueBoostSports.includes(s.id);
    el.className = `nav-item ${state.sport === s.id ? 'active' : ''} ${isVenueBoost ? 'venue-boost' : ''}`;
    el.textContent = `${s.emoji} ${s.name.toUpperCase()}`;
    el.onclick = () => navigate('sport', s.id);
    nav.appendChild(el);
  });
  return nav;
}

function navigate(view, sportId, eventObj) {
  if (view === 'home') state = { view: 'home', sport: null, event: null };
  else if (view === 'sport') { state = { view: 'sport', sport: sportId, event: null }; recordView('sport', sportId); }
  else if (view === 'event') { state = { view: 'event', sport: sportId, event: eventObj }; recordView('event', eventObj.id); recordView('venue', eventObj.venue); }
  render();
}

// ═══════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════

function render() {
  const app = document.getElementById('mainView');
  const topControls = document.getElementById('topControls');
  const promoBanner = document.getElementById('promoBanner');

  // Banner
  if (hasHistory()) promoBanner.classList.add('show');

  // Rebuild nav
  const existingNav = document.querySelector('.nav-bar');
  const newNav = buildNav();
  if (existingNav) existingNav.replaceWith(newNav);
  else document.querySelector('.top-controls').before(newNav);

  // Top controls
  if (state.view === 'home') {
    topControls.style.display = 'none';
  } else {
    topControls.style.display = 'flex';
    buildBreadcrumb();
  }

  // Content
  app.innerHTML = '';

  if (state.view === 'home') renderHome(app);
  else if (state.view === 'sport') renderSport(app);
  else if (state.view === 'event') renderEvent(app);

  updateTicker();
  updateSessionLabel();
}

function renderHome(app) {
  // Hero
  const hero = document.createElement('div');
  hero.className = 'hero';
  hero.innerHTML = `
    <div class="hero-eyebrow">THE HOME OF LIVE SPORT</div>
    <div class="hero-title">EVERY TICKET.<br><em>EVERY EVENT.</em></div>
    <div class="hero-sub">From Wembley to Wimbledon, ringside to Paddock Club — find your seat for every major sport.</div>
  `;
  app.appendChild(hero);

  const wrap = document.createElement('div');
  wrap.className = 'page-wrap';

  const label = document.createElement('div');
  label.className = 'section-label';
  label.textContent = hasHistory() ? 'RANKED BY YOUR INTEREST' : 'ALL SPORTS';
  wrap.appendChild(label);

  const title = document.createElement('div');
  title.className = 'section-title';
  title.textContent = hasHistory() ? 'YOUR PICKS' : 'CHOOSE YOUR SPORT';
  wrap.appendChild(title);

  const grid = document.createElement('div');
  grid.className = 'sports-grid';

  const rankedSports = rankSports();
  const venueBoostSports = getVenueBoostSports();
  const prevOrder = JSON.parse(sessionStorage.getItem('sports_order') || '[]');
  const currentOrder = rankedSports.map(s => s.id);

  rankedSports.forEach((sport, idx) => {
    const prevIdx = prevOrder.indexOf(sport.id);
    const moved = prevOrder.length > 0 && prevIdx !== -1 && prevIdx !== idx;
    const movedUp = moved && prevIdx > idx;
    const movedDown = moved && prevIdx < idx;
    const isVenueBoost = venueBoostSports.includes(sport.id);

    const card = document.createElement('div');
    card.className = `sport-card ${movedUp ? 'flash-up' : ''} ${movedDown ? 'flash-down' : ''}`;
    card.style.setProperty('--sport-color', sport.color);
    card.dataset.sportId = sport.id;

    const w = loadW();
    const directClicks = w[`sport:${sport.id}`] || 0;
    const totalScore = getSportScore(sport.id);

    card.innerHTML = `
      <span class="sport-emoji">${sport.emoji}</span>
      <div class="sport-name">${sport.name}</div>
      <div class="sport-meta">${sport.events} EVENTS AVAILABLE</div>
      ${isVenueBoost ? '<span class="boost-tag">★ VENUE MATCH</span>' : ''}
      <div class="sport-count">${idx + 1}</div>
      ${hasHistory() && directClicks > 0 ? `<div class="sport-rank">${directClicks} VIEW${directClicks !== 1 ? 'S' : ''}</div>` : ''}
    `;
    card.onclick = () => navigate('sport', sport.id);
    grid.appendChild(card);
  });

  sessionStorage.setItem('sports_order', JSON.stringify(currentOrder));
  wrap.appendChild(grid);
  app.appendChild(wrap);
}

function renderSport(app) {
  const sport = SPORTS.find(s => s.id === state.sport);
  if (!sport) return;

  const wrap = document.createElement('div');
  wrap.className = 'page-wrap';

  const label = document.createElement('div');
  label.className = 'section-label';
  label.textContent = hasHistory() ? 'PERSONALISED EVENT ORDER' : 'UPCOMING EVENTS';
  wrap.appendChild(label);

  const titleRow = document.createElement('div');
  titleRow.style.cssText = 'display:flex;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap;';
  titleRow.innerHTML = `
    <div class="section-title" style="color:${sport.color}">${sport.emoji} ${sport.name.toUpperCase()}</div>
    <div style="font-family:'Space Mono',monospace;font-size:0.7rem;color:var(--muted);letter-spacing:1px;padding-bottom:8px;">${sport.events} EVENTS</div>
  `;
  wrap.appendChild(titleRow);

  const grid = document.createElement('div');
  grid.className = 'events-grid';

  const rankedEvents = rankEvents(state.sport);
  const prevOrder = JSON.parse(sessionStorage.getItem(`events_${state.sport}`) || '[]');
  const currentOrder = rankedEvents.map(e => e.id);

  rankedEvents.forEach((event, idx) => {
    const prevIdx = prevOrder.indexOf(event.id);
    const moved = prevOrder.length > 0 && prevIdx !== -1 && prevIdx !== idx;
    const movedUp = moved && prevIdx > idx;
    const movedDown = moved && prevIdx < idx;

    const venue = VENUES[event.venue];
    const avail = event.avail;
    const card = document.createElement('div');
    card.className = `event-card ${movedUp ? 'flash-up' : ''} ${movedDown ? 'flash-down' : ''}`;
    card.style.setProperty('--event-color', event.color);

    const w = loadW();
    const views = w[`event:${event.id}`] || 0;

    card.innerHTML = `
      <div class="rank-indicator">${idx + 1}</div>
      <div class="event-header">
        <div class="event-sport-tag">${sport.name.toUpperCase()} · ${event.subtitle}</div>
        <div class="event-name">${event.name}</div>
        <div class="event-date-badge">${event.date}</div>
      </div>
      <div class="event-body">
        <div class="event-venue">
          <div class="event-venue-dot"></div>
          ${venue ? venue.name + ' · ' + venue.city : event.venue.toUpperCase()}
        </div>
        <div class="event-price-range">FROM £${event.from} <span>/ ticket</span></div>
        <div class="event-avail">
          <div class="avail-bar-wrap">
            <div class="avail-label">AVAILABILITY</div>
            <div class="avail-bar"><div class="avail-fill ${avail < 25 ? 'low' : ''}" style="width:${avail}%"></div></div>
          </div>
          <div class="cta-arrow">→</div>
        </div>
        ${views > 0 ? `<div style="font-family:'Space Mono',monospace;font-size:0.6rem;color:var(--muted);margin-top:8px;letter-spacing:1px;">VIEWED ${views}×</div>` : ''}
      </div>
    `;
    card.onclick = () => navigate('event', state.sport, event);
    grid.appendChild(card);
  });

  sessionStorage.setItem(`events_${state.sport}`, JSON.stringify(currentOrder));
  wrap.appendChild(grid);
  app.appendChild(wrap);
}

function renderEvent(app) {
  const event = state.event;
  if (!event) return;
  const sport = SPORTS.find(s => s.id === state.sport);
  const venue = VENUES[event.venue];

  const wrap = document.createElement('div');
  wrap.className = 'page-wrap';

  const detail = document.createElement('div');
  detail.className = 'detail-wrap';

  // Hero
  detail.innerHTML = `
    <div class="event-hero" style="--hero-color:${event.color}">
      <div class="event-hero-sport">${sport ? sport.emoji + ' ' + sport.name.toUpperCase() : ''} · ${event.subtitle}</div>
      <div class="event-hero-name">${event.name}</div>
      <div class="event-hero-meta">
        <div class="meta-pill">📅 <strong>${event.date}</strong></div>
        <div class="meta-pill">📍 <strong>${venue ? venue.name : event.venue}</strong></div>
        <div class="meta-pill">🏙️ <strong>${venue ? venue.city : ''}</strong></div>
        <div class="meta-pill">🎟 FROM <strong>£${event.from}</strong></div>
      </div>
    </div>
    <div class="tickets-section">
      <div class="tickets-header">
        <div class="tickets-title">SELECT TICKETS</div>
        <div style="font-family:'Space Mono',monospace;font-size:0.68rem;color:var(--muted);letter-spacing:1px;">${event.tiers.length} TIERS AVAILABLE</div>
      </div>
      ${event.tiers.map(tier => renderTicketStub(tier, event)).join('')}
      <div style="height:16px"></div>
    </div>
  `;

  // Venue cross-sell
  const crossEvents = getEventsAtVenue(event.venue, state.sport);
  if (crossEvents.length > 0) {
    const venueSection = document.createElement('div');
    venueSection.className = 'venue-section';
    const venueName = venue ? venue.name : event.venue;
    venueSection.innerHTML = `
      <div class="venue-title">🏟 MORE AT ${venueName.toUpperCase()}</div>
      <div class="venue-sub">OTHER EVENTS AT THIS VENUE — VIEWING THESE BOOSTS THEIR SPORT IN YOUR FEED</div>
      <div class="venue-events-row">
        ${crossEvents.map(e => {
          const s = SPORTS.find(sp => sp.id === e.sport);
          return `
            <div class="venue-mini-card" onclick="navigate('event','${e.sport}',EVENTS['${e.sport}'].find(ev=>ev.id==='${e.id}'))">
              <div class="vmc-sport">${s ? s.emoji + ' ' + s.name.toUpperCase() : e.sport.toUpperCase()}</div>
              <div class="vmc-name">${e.name}</div>
              <div class="vmc-price">FROM £${e.from} · ${e.date}</div>
            </div>
          `;
        }).join('')}
      </div>
    `;
    detail.appendChild(venueSection);
  }

  wrap.appendChild(detail);
  app.appendChild(wrap);
}

function renderTicketStub(tier, event) {
  const pct = Math.round((tier.avail / tier.total) * 100);
  const scarce = pct < 20;
  return `
    <div class="ticket-stub">
      <div class="hole top"></div>
      <div class="hole bottom"></div>
      <div class="ticket-left" style="--tier-color:${tier.color}">
        <div class="tier-name">${tier.name}</div>
        <div class="tier-price">£${tier.price}</div>
        <div class="tier-price-sub">PER TICKET</div>
      </div>
      <div class="ticket-right">
        <ul class="ticket-perks">
          ${tier.perks.map(p => `<li style="--tier-color:${tier.color}">${p}</li>`).join('')}
        </ul>
        <div class="ticket-bottom">
          <div class="avail-text ${scarce ? 'scarce' : 'ok'}">
            ${scarce ? `⚡ ONLY ${tier.avail} LEFT` : `✓ ${tier.avail} AVAILABLE`}
          </div>
          <button class="buy-btn" style="--tier-color:${tier.color}" onclick="addToCart('${tier.name}',${tier.price},'${event.name}')">
            BUY →
          </button>
        </div>
      </div>
    </div>
  `;
}

// ═══════════════════════════════════════════════════════
// BREADCRUMB
// ═══════════════════════════════════════════════════════

function buildBreadcrumb() {
  const trail = document.getElementById('bcTrail');
  const btn = document.getElementById('backBtn');
  trail.innerHTML = '';

  const parts = [{ label:'HOME', fn:() => navigate('home') }];
  if (state.sport) {
    const s = SPORTS.find(sp => sp.id === state.sport);
    parts.push({ label: s ? s.name.toUpperCase() : state.sport.toUpperCase(), fn:() => navigate('sport', state.sport) });
  }
  if (state.event) {
    parts.push({ label: state.event.name, fn: null });
  }

  parts.forEach((p, i) => {
    if (i > 0) { const sep = document.createElement('span'); sep.className='bc-sep'; sep.textContent='›'; trail.appendChild(sep); }
    const el = document.createElement('span');
    el.textContent = p.label;
    if (!p.fn) el.className = 'bc-active';
    else el.onclick = p.fn;
    trail.appendChild(el);
  });

  btn.onclick = () => {
    if (state.view === 'event') navigate('sport', state.sport);
    else if (state.view === 'sport') navigate('home');
  };
}

// ═══════════════════════════════════════════════════════
// CART
// ═══════════════════════════════════════════════════════

function addToCart(tier, price, event) {
  cart.push({ tier, price, event });
  document.getElementById('cartCount').textContent = cart.length;
  const toast = document.getElementById('cartToast');
  toast.textContent = `🎟 ${tier} TICKET ADDED — £${price}`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ═══════════════════════════════════════════════════════
// TICKER
// ═══════════════════════════════════════════════════════

function updateTicker() {
  const items = [];
  Object.values(EVENTS).flat().forEach(e => {
    items.push(`${e.name}  ·  FROM £${e.from}  ·  ${e.date}`);
  });
  const doubled = [...items, ...items];
  document.getElementById('tickerInner').innerHTML = doubled.map(t => `<span class="ticker-item">${t}</span>`).join('');
}

function updateSessionLabel() {
  const w = loadW();
  const totalClicks = Object.values(w).reduce((a,b) => a+b, 0);
  document.getElementById('sessionLabel').textContent = totalClicks > 0
    ? `${totalClicks} INTERACTION${totalClicks!==1?'S':''}`
    : 'NEW SESSION';
}
